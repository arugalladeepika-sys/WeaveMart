version: '3.8'

services:
  weavemart:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weavemart-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/weavemartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - weavemart_data:/app/data
      - weavemart_uploads:/app/uploads
    restart: unless-stopped

volumes:
  weavemart_data:
  weavemart_uploads:
